name: Deploy mdBook site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 
    steps:
      - uses: actions/checkout@v4

      - name: Install Latest Binaries
        run: |
          MDBOOK_URL=$(curl -s https://api.github.com/repos/rust-lang/mdBook/releases/latest | jq -r '.assets[] | select(.name | contains("x86_64-unknown-linux-gnu.tar.gz")) | .browser_download_url')
          curl -sSL "$MDBOOK_URL" | tar -xz

          EMBEDIFY_URL=$(curl -s https://api.github.com/repos/MR-Addict/mdbook-embedify/releases/latest | jq -r '.assets[] | select(.name | contains("x86_64-unknown-linux-gnu.zip")) | .browser_download_url')
          curl -sSL -o embedify.zip "$EMBEDIFY_URL"
          
          unzip -q embedify.zip
          find . -name "mdbook-embedify" -type f -exec mv {} . \;

          chmod +x mdbook mdbook-embedify
          sudo mv mdbook mdbook-embedify /usr/local/bin/

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with mdBook
        run: mdbook build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
