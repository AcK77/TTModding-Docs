name: Deploy mdBook site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: 0.4.40
      ALERTS_VERSION: 0.8.0
      EMBEDIFY_VERSION: 0.3.2
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook and Plugins
        run: |
          mkdir -p bin
          
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C bin

          curl -sSL -o bin/mdbook-alerts https://github.com/lambdalisue/rs-mdbook-alerts/releases/download/v${ALERTS_VERSION}/mdbook-alerts-v${ALERTS_VERSION}-x86_64-unknown-linux-gnu.tar.gz
          cd bin && (tar -xzf mdbook-alerts || true) && cd ..

          curl -sSL -o bin/mdbook-embedify.tar.gz https://github.com/MR-Addict/mdbook-embedify/releases/download/v${EMBEDIFY_VERSION}/mdbook-embedify-v${EMBEDIFY_VERSION}-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf bin/mdbook-embedify.tar.gz -C bin

          chmod +x bin/mdbook*
          sudo mv bin/mdbook* /usr/local/bin/

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with mdBook
        run: mdbook build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
